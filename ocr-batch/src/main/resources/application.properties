# ---------------------------------------------------------------------------
# Vision OCR batch - defaults. Override with:
#   * an external file:     -Dconfig.file=/path/application.properties
#   * system properties:    -Dbatch.commit-interval=10
#   * environment variables (secrets): AZURE_DI_ENDPOINT, AZURE_DI_KEY, FIELD_ENCRYPTION_KEY, DB_PASSWORD
# ---------------------------------------------------------------------------

# ---- Input / output ----
input.dir=./data/input
input.extensions=pdf,tif,tiff,jpg,jpeg,png
# Azure DI paid tier limit is 500 MB per file
input.max-file-mb=500
# false (default) = store only the extracted fields JSON (doc_azure_result.fields_json: name, value,
#   OCR text, confidence, type per field). Re-mapping (reprocess from MAP) works with it.
# true = also keep Azure's full response (compressed, result_json_gz): word positions, page text,
#   bounding boxes - useful for audits, debugging and generating training labels, but much larger.
results.store-full-json=false

# ---- Database: Microsoft SQL Server (2016 SP1+ / Azure SQL) ----
# All objects of this job live in the schema "ocr" of the target database (created if missing).
# Set these in application-local.properties or as environment variables.
db.url=${DB_URL:}
#   e.g. jdbc:sqlserver://<server>:1433;databaseName=<existing db>;encrypt=true;trustServerCertificate=false
db.driver=com.microsoft.sqlserver.jdbc.SQLServerDriver
db.user=${DB_USER:}
db.password=${DB_PASSWORD:}
# true = create missing ocr.* objects at startup (create-only, never drops anything)
# false = a DBA has run schema-batch-sqlserver.sql and schema-app-sqlserver.sql
db.init=true
db.pool-size=10

# ---- Azure Document Intelligence ----
azure.endpoint=${AZURE_DI_ENDPOINT:}
# Leave empty to use Microsoft Entra ID (managed identity / az login) instead of a key
azure.api-key=${AZURE_DI_KEY:}
# Custom classifier id. EMPTY = no classifier: every document gets classify.default-doc-type
# (files in input/<DOC_TYPE>/ always use the folder's doc type).
azure.classifier-id=${AZURE_DI_CLASSIFIER_ID:}
classify.default-doc-type=AUTO_PAY_AUTH
azure.max-retries=5
azure.poll-interval-seconds=2
azure.timeout-seconds=300
# Corporate proxy for calls to Azure (leave host empty for a direct connection)
azure.proxy.host=
azure.proxy.port=
azure.proxy.username=
azure.proxy.password=${AZURE_PROXY_PASSWORD:}

# ---- Retry of failed documents ----
# Retryable failures (throttling, timeouts, 5xx) -> ERROR, re-queued at next_retry_at by the next run.
# Delay = base * 2^(attempt-1), capped. After max-attempts consecutive failures -> FAILED.
retry.max-attempts=4
retry.base-delay-minutes=5
retry.max-delay-minutes=240

# ---- Batch tuning ----
# Documents sent to Azure in parallel (classify + extract). Keep below your Azure resource's
# transactions-per-second limit; db.pool-size must be at least batch.threads + 2.
batch.threads=4
batch.page-size=20
batch.commit-interval=5

# ---- Optional reference data ----
# CSV "routingNumber,bankName" for the routing/bank-name cross check. Empty = check disabled.
reference.routing-directory-csv=

# ---- Doc types ----
# Built-in doc types: classpath doctypes/*.xml. Extra doc types (e.g. created in the demo UI) are loaded
# from the folder given by the SYSTEM property / environment variable doctypes.dir (default ./doctypes).
# (Set it with -Ddoctypes.dir=..., not in this file: it is read before this file is loaded.)

# ---- Per doc type model ids (referenced from doctypes/*.xml) ----
doctype.auto-pay-auth.model-id=autopay-neural-v2

# ---- Retention (schema ocr only; 0 = keep forever) ----
# Full Azure JSON (doc_azure_result.result_json_gz) - fields_json is kept, so re-mapping still works
retention.full-json-days=180
# doc_status_history and doc_error rows
retention.history-days=730
# Spring Batch run records (ocr.BATCH_*) of finished runs
retention.batch-metadata-days=90
# rows per delete batch (each batch is its own short transaction)
retention.delete-batch-size=5000
